<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24251c" />
      <stop offset="55%" stop-color="#141510" />
      <stop offset="100%" stop-color="#0c0d0a" />
    </radialGradient>

    <!-- Metallic 24K Gold Gradient (Luxury Champagne Gold) -->
    <linearGradient id="gold24k" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fff9d6" />
      <stop offset="20%" stop-color="#fed66b" />
      <stop offset="48%" stop-color="#f59e0b" />
      <stop offset="72%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#fed66b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.38" />
    </filter>
    
    <filter id="kissGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Sensual Kiss / Lips Silhouette -->
    <g id="kissLips">
      <!-- Upper lip with refined Cupid's bow -->
      <path d="M -30 0 
               C -20 -11 -9 -12 0 -5 
               C 9 -12 20 -11 30 0 
               C 18 -3 9 -3 0 2 
               C -9 -3 -18 -3 -30 0 Z" 
            fill="url(#gold24k)" />
      <!-- Lower lip plump curve -->
      <path d="M -26 2 
               C -16 3 -7 5 0 3 
               C 7 5 16 3 26 2 
               C 18 15 -18 15 -26 2 Z" 
            fill="url(#gold24k)" />
      <!-- Subtle center parting depth -->
      <path d="M -22 1.5 Q 0 3.5 22 1.5" 
            fill="none" stroke="#682c04" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Refined, slender Triquetra Petal Loop (Origin at 0, 0, pointing straight UP) -->
    <path id="petalLoop"
          d="M 0 0 
             C -68 -48 -70 -142 0 -195 
             C 70 -142 68 -48 0 0 Z" />
  </defs>

  <!-- PWA Container / App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  
  <!-- Outer Gold Rim -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#2c2a21" stroke-width="3" />
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#gold24k)" stroke-width="1.5" opacity="0.25" />

  <!-- Ambient geometry -->
  <circle cx="256" cy="275" r="195" fill="none" stroke="#26271e" stroke-width="2" stroke-dasharray="4 8" opacity="0.5" />

  <!-- MAIN TRIQUETRA & KISSES EMBLEM -->
  <g filter="url(#luxuryGlow)">

    <!-- INTERLACED EMBLEM RING -->
    <circle cx="256" cy="275" r="82" 
            fill="none" 
            stroke="url(#gold24k)" 
            stroke-width="17" />
    <circle cx="256" cy="275" r="82" 
            fill="none" 
            stroke="#451a03" 
            stroke-width="1.5" 
            opacity="0.4" />

    <!-- 3 INTERWOVEN PETAL LOOPS OF THE TRIQUETRA -->
    <!-- Petal 1 (Top: 0 deg) -->
    <use href="#petalLoop" 
         transform="translate(256, 275)" 
         fill="none" 
         stroke="url(#gold24k)" 
         stroke-width="19" 
         stroke-linejoin="round"
         stroke-linecap="round" />

    <!-- Petal 2 (Bottom-Left: 120 deg) -->
    <use href="#petalLoop" 
         transform="translate(256, 275) rotate(120)" 
         fill="none" 
         stroke="url(#gold24k)" 
         stroke-width="19" 
         stroke-linejoin="round"
         stroke-linecap="round" />

    <!-- Petal 3 (Bottom-Right: 240 deg) -->
    <use href="#petalLoop" 
         transform="translate(256, 275) rotate(240)" 
         fill="none" 
         stroke="url(#gold24k)" 
         stroke-width="19" 
         stroke-linejoin="round"
         stroke-linecap="round" />

    <!-- Outer fine ridge highlights on each petal for 3D beveled luster -->
    <use href="#petalLoop" transform="translate(256, 275)" fill="none" stroke="#fff9d6" stroke-width="2" opacity="0.65" />
    <use href="#petalLoop" transform="translate(256, 275) rotate(120)" fill="none" stroke="#fff9d6" stroke-width="2" opacity="0.65" />
    <use href="#petalLoop" transform="translate(256, 275) rotate(240)" fill="none" stroke="#fff9d6" stroke-width="2" opacity="0.65" />

    <!-- THE THREE KISS MARKS (Inside each of the 3 sacred lobes) -->
    <!-- Top Kiss -->
    <g transform="translate(256, 172) scale(1.08)" filter="url(#kissGlow)">
      <use href="#kissLips" />
    </g>

    <!-- Bottom-Left Kiss -->
    <g transform="translate(256, 275) rotate(120) translate(0, -103) rotate(-120) scale(1.08)" filter="url(#kissGlow)">
      <use href="#kissLips" />
    </g>

    <!-- Bottom-Right Kiss -->
    <g transform="translate(256, 275) rotate(240) translate(0, -103) rotate(-240) scale(1.08)" filter="url(#kissGlow)">
      <use href="#kissLips" />
    </g>

    <!-- Central Core Golden Jewel -->
    <circle cx="256" cy="275" r="9" fill="url(#gold24k)" />
    <circle cx="256" cy="275" r="4.5" fill="#fff9d6" />
    <circle cx="256" cy="275" r="1.5" fill="#451a03" />

  </g>
</svg>