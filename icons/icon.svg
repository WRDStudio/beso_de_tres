<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d17"/>
      <stop offset="100%" stop-color="#12130f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for Android maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2e3026" stroke-width="4"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="#181914" stroke="#2e3026" stroke-width="3"/>
  
  <!-- Exchange arrows loop -->
  <path d="M190 200 H322 M300 178 L324 200 L300 222" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M322 312 H190 M212 290 L188 312 L212 334" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Currency symbols center -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="2">$ · ₡</text>
</svg>
